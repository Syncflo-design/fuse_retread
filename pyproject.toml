[project]
name = "fuse_retread"
authors = [{ name = "Syncflo", email = "ops@syncflo.co.za" }]
description = "Tyre retreading for Fuse: every tyre traced from the branch, through the factory and back to its owner, on simple floor screens."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# ERPNext is required for Customer and Company. fuse_core is required for the module switches
# and, through fuse_theme, the tiles on Fuse Home.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.flit.module]
name = "fuse_retread"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Frappe apps indent with tabs; E101/W191 fight that convention, not real defects.
ignore = ["E101", "E501", "W191"]

[tool.ruff.lint.isort]
known-third-party = ["frappe", "erpnext", "fuse_core"]

[tool.ruff.format]
indent-style = "tab"
